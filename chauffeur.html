<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tournée — Dakar City Transport</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
:root{--border:#E0E0E0;--font:'DM Sans',sans-serif;}
*{box-sizing:border-box;}
body{margin:0;padding:0;font-family:var(--font);background:#e8e8e8;min-height:100vh;}
.wrap{max-width:460px;margin:0 auto;padding:20px 14px 40px;}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.1);overflow:hidden;margin-bottom:16px;}
.pad{padding:22px 18px;}
.topbar{height:8px;background:#006b2d;}
.logo{width:44px;height:44px;border-radius:50%;background:#006b2d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin:0 auto 14px;}
h1{font-size:17px;text-align:center;color:#111;margin:0 0 4px;}
.sub{font-size:12.5px;text-align:center;color:#777;margin:0 0 22px;line-height:1.5;}
label{font-size:12px;font-weight:700;color:#444;display:block;margin-bottom:6px;}
input{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:var(--font);margin-bottom:16px;}
.btn{width:100%;padding:15px;border:none;border-radius:10px;font-size:14.5px;font-weight:800;font-family:var(--font);cursor:pointer;}
.btn-green{background:#006b2d;color:#fff;}
.btn-light{background:#e8f7ee;color:#00b34e;border:1.5px solid #B7E4C7;}
.err{background:#FDEDED;border:1.5px solid #F5C6C6;color:#992020;font-size:12.5px;font-weight:600;border-radius:9px;padding:10px 12px;margin-bottom:14px;text-align:center;display:none;}
.hdr2{background:#006b2d;color:#fff;padding:16px 18px;}
.hdr2 .nom{font-size:15px;font-weight:800;}
.hdr2 .compteur{font-size:12px;opacity:.9;margin-top:2px;}
.barre-bg{height:6px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:10px;overflow:hidden;}
.barre{height:100%;background:#fff;border-radius:4px;}
.liste{padding:14px;}
.client{border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.client.fait{border-color:#B7E4C7;background:#F5FBF7;}
.client.refuse{border-color:#F5C6C6;background:#FFF7F7;}
.client-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.client-nom{font-size:14.5px;font-weight:800;color:#111;}
.client-adresse{font-size:12.5px;color:#666;margin-top:3px;line-height:1.4;}
.client-colis{font-size:12.5px;color:#333;margin-top:5px;line-height:1.4;background:#F5F5F5;border-radius:8px;padding:6px 9px;}
.badge-fait{font-size:10px;font-weight:800;background:#00b34e;color:#fff;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.badge-refus{font-size:10px;font-weight:800;background:#c0392b;color:#fff;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.actions{display:flex;gap:7px;margin-top:11px;}
.act{flex:1;text-align:center;padding:11px 4px;border-radius:9px;font-size:12px;font-weight:700;border:1.5px solid var(--border);color:#333;text-decoration:none;display:block;}
.act-recup{background:#006b2d;color:#fff;border:none;font-weight:800;cursor:pointer;}
.act-refus{background:#FDEDED;border:1.5px solid #F5C6C6;color:#992020;font-weight:800;cursor:pointer;}
.act-whatsapp{background:#25D366;color:#fff;border:none;font-weight:800;cursor:pointer;}
.cloture-note{font-size:11px;color:#4a8a63;margin-top:8px;padding-top:8px;border-top:1px dashed #C8E6D0;font-weight:600;}
.refus-note{font-size:11px;color:#992020;margin-top:8px;padding-top:8px;border-top:1px dashed #F5C6C6;font-weight:600;}
.montant-note{font-size:11px;color:#1a7a40;margin-top:6px;font-weight:600;}
.motif{padding:14px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:9px;font-size:13.5px;font-weight:700;color:#333;cursor:pointer;background:#fff;text-align:left;width:100%;font-family:var(--font);}
.photo-vignette{width:56px;height:56px;border-radius:8px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.photo-vignette img{width:100%;height:100%;object-fit:cover;}
.vignettes{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap;}
[hidden]{display:none!important;}
.retour{font-size:12.5px;color:#888;text-align:center;margin-top:10px;cursor:pointer;text-decoration:underline;}
.montant-bloc{background:#F5FBF7;border:1.5px solid #B7E4C7;border-radius:10px;padding:12px;margin-bottom:16px;}
.montant-bloc label{margin-bottom:8px;}
.montant-row{display:flex;gap:8px;align-items:center;}
.montant-row input{margin-bottom:0;flex:1;text-align:center;font-size:18px;font-weight:700;}
.btn-passer{flex-shrink:0;padding:14px 14px;border:1.5px solid #ccc;background:#f2f2f2;color:#555;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:#fff;border-radius:16px;padding:20px 18px;max-width:380px;width:100%;}
.modal-title{font-size:15.5px;font-weight:800;color:#111;margin-bottom:8px;text-align:center;}
.modal-sub{font-size:13px;color:#666;margin-bottom:16px;text-align:center;line-height:1.5;}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-sm{padding:12px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);}
.btn-gray-sm{background:#f0f0f0;color:#444;}
.btn-green-sm{background:#006b2d;color:#fff;}
</style>
</head>
<body>
<div class="wrap">

  <div id="ecran-code" class="card">
    <div class="topbar"></div>
    <div class="pad">
      <div class="logo">DCT</div>
      <h1>Ta tournée du jour</h1>
      <div class="sub">Tape le code donné par Dakar City Transport pour retrouver les colis à récupérer.</div>
      <div id="code-err" class="err"></div>
      <label>Code d'accès</label>
      <input id="code-input" placeholder="ex : 4827" inputmode="numeric" maxlength="4" style="text-align:center;font-size:22px;font-weight:800;letter-spacing:.15em;">
      <button class="btn btn-green" onclick="ouvrirTournee()">Voir ma tournée</button>
    </div>
  </div>

  <div id="ecran-tournee" hidden>
    <div class="card">
      <div class="hdr2">
        <div class="nom" id="tr-nom">👋 Salut</div>
        <div class="compteur" id="tr-compteur"></div>
        <div class="barre-bg"><div class="barre" id="tr-barre" style="width:0%;"></div></div>
      </div>
      <div style="padding:12px 14px 0;">
        <button type="button" class="btn" style="background:#fff;border:1.5px solid #006b2d;color:#006b2d;padding:11px;" onclick="ouvrirCarte()">🗺️ Voir mon trajet sur la carte</button>
      </div>
      <div class="liste" id="tr-liste"></div>
      <div style="text-align:center;color:#bbb;font-size:10.5px;padding:4px 0 12px;">Module chauffeur <span id="tr-version"></span></div>
    </div>
  </div>

  <div id="ecran-carte" hidden class="card" style="padding:0;overflow:hidden;">
    <div id="carte-map" style="width:100%;height:70vh;"></div>
    <div class="pad" style="padding-top:14px;padding-bottom:16px;">
      <div class="retour" onclick="fermerCarte()">← Retour à la tournée</div>
    </div>
  </div>

  <div id="ecran-photo" hidden class="card">
    <div class="pad">
      <h1 style="text-align:left;" id="ph-nom"></h1>
      <div class="sub" style="text-align:left;margin-bottom:4px;" id="ph-sous">Aucune photo prise.</div>
      <div class="vignettes" id="ph-vignettes"></div>
      <input type="file" id="ph-input" accept="image/*" capture="environment" hidden onchange="photoChoisie(this)">
      <button class="btn act-recup" style="margin-bottom:9px;" onclick="document.getElementById('ph-input').click()">📷 <span id="ph-btn-txt">Prendre une photo</span></button>

      <div class="montant-bloc">
        <label>💵 Montant reçu (€) <span style="color:#999;font-weight:500;">· indicatif, facultatif</span></label>
        <div class="montant-row">
          <input id="ph-montant" type="number" min="0" inputmode="numeric" placeholder="ex : 25000">
          <button type="button" class="btn-passer" id="ph-montant-passer" onclick="passerMontant()">Passer</button>
        </div>
      </div>

      <button class="btn btn-light" id="ph-terminer" onclick="terminerRecuperation()" disabled style="opacity:.45;">✅ Terminer — clôturer ce client</button>
      <div class="retour" onclick="fermerEcranPhoto()">← Retour à la tournée</div>
    </div>
  </div>

  <div id="ecran-motif" hidden class="card">
    <div class="pad">
      <h1 style="text-align:left;">Colis non récupéré ?</h1>
      <div class="sub" style="text-align:left;margin-bottom:16px;" id="mo-nom"></div>
      <div id="mo-liste"></div>
      <div class="retour" onclick="fermerEcranMotif()">← Retour à la tournée</div>
    </div>
  </div>

</div>

<!-- Modale de confirmation du montant reçu (v1.1.0) -->
<div class="modal-overlay" id="modal-montant-confirm">
  <div class="modal-sheet">
    <div class="modal-title">💵 Confirmer le montant</div>
    <div class="modal-sub" id="modal-montant-texte"></div>
    <div class="modal-btns">
      <button class="btn-sm btn-gray-sm" onclick="fermerModalMontant()">Annuler</button>
      <button class="btn-sm btn-green-sm" onclick="confirmerMontantEtCloture()">✅ Confirmer</button>
    </div>
  </div>
</div>

<!-- Modale de modification du montant après clôture, dans les 10 min (v1.1.0) -->
<div class="modal-overlay" id="modal-montant-edit">
  <div class="modal-sheet">
    <div class="modal-title">✏️ Modifier le montant</div>
    <input id="edit-montant-input" type="number" min="0" inputmode="numeric" placeholder="ex : 25000" style="margin-bottom:14px;">
    <div class="modal-btns">
      <button class="btn-sm btn-gray-sm" onclick="fermerModalEditMontant()">Annuler</button>
      <button class="btn-sm btn-green-sm" onclick="confirmerEditMontant()">✅ Enregistrer</button>
    </div>
  </div>
</div>

<script>
// Repère visible en bas de l'écran de tournée (#tr-version) pour vérifier
// rapidement qu'une mise à jour est bien en ligne, sans deviner via le
// comportement — même principe que "Module départs vX.X.X" dans departs.js.
var CHAUFFEUR_VERSION = 'v1.1.0';

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var MOTIFS_NON_RAMASSE = [
  {id:'annule',      lib:'Le client a annulé'},
  {id:'absent',      lib:'Client absent au passage'},
  {id:'injoignable', lib:'Client injoignable'},
  {id:'adresse',     lib:'Adresse introuvable'}
];

var PHOTO_MAX = 5, PHOTO_COTE = 1000, PHOTO_QUALITE = 0.55;
// Fenêtre de correction du montant reçu après clôture (voir
// modifierMontantRecolte) — au-delà, verrouillé (retour de Cobey du
// 06/09/2026 : "on donne un maximum de 10 min pour pouvoir modifier la
// saisie, après impossible").
var MONTANT_DELAI_EDITION = 10 * 60 * 1000;

function compresserPhoto(file, cb){
  try{
    var r = new FileReader();
    r.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var f = Math.min(1, PHOTO_COTE / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * f); cv.height = Math.round(h * f);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL('image/jpeg', PHOTO_QUALITE));
      };
      img.onerror = function(){ cb(null); };
      img.src = ev.target.result;
    };
    r.onerror = function(){ cb(null); };
    r.readAsDataURL(file);
  }catch(e){ cb(null); }
}

var firebaseConfig = {
  apiKey: "AIzaSyCs7oTZAG8vzhqY3rSEqCnwSnQY8hm_f2A",
  authDomain: "dakar-collecte.firebaseapp.com",
  databaseURL: "https://dakar-collecte-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dakar-collecte",
  storageBucket: "dakar-collecte.firebasestorage.app",
  messagingSenderId: "910296510414",
  appId: "1:910296510414:web:de6b814b3420adcd68859f"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// Page à part, sans PIN (ouverte via un lien + code WhatsApp) — même
// principe de connexion anonyme que facture.html : un badge invisible
// pour passer les règles Firebase resserrées, ne remplace pas le code
// d'accès qui, lui, reste le vrai contrôle d'accès à cette tournée.
var _connexionAnonyme = firebase.auth
  ? firebase.auth().signInAnonymously().catch(function(e){ console.error('chauffeur: connexion anonyme', e); })
  : Promise.resolve();

var ctx = null; // { collecteId, camion, nom, code }
var clientsTournee = []; // [{id, ...fiche}]
var truckCourant = null; // dernier objet camion reçu (pour horaires + carte)
var carteInstance = null;
var clientCourantPhoto = null;
var photosCourantes = [];
var clientEnEditionMontant = null;

(function(){
  var m = /[?&]code=(\d{3,6})/.exec(location.search);
  if(m) $('code-input').value = m[1];
})();

// v1.21.0 : notification dans le fil d'Activité DCT à chaque action du
// chauffeur externe (récupéré / non récupéré) — jusqu'ici invisible côté
// DCT en temps réel (retour de Cobey du 06/09/2026). Écrit directement
// dans le même nœud Firebase que addActivity() côté appli principale
// (activite_items), avec la même forme — chauffeur.html n'a pas accès
// aux fonctions natives (page à part), donc pas d'appel direct possible.
function _activiteExterne(emoji, texte){
  try{
    var now = new Date();
    var dateStr = now.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
    var heureStr = now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    db.ref('activite_items').push({
      ts: Date.now(),
      emoji: emoji,
      bg: '#F5F6FC',
      text: texte,
      timeLabel: dateStr + ' à ' + heureStr
    });
  }catch(e){ console.error('chauffeur: écriture activité', e); }
}

// Format international requis par WhatsApp (wa.me) : chiffres seuls, sans
// le 0 initial — même heuristique que le rappel avant-ramasse côté appli
// principale (clients ramassés en France).
function _telIntl(tel){
  var digits = String(tel||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.charAt(0) === '0') return '33' + digits.slice(1);
  return digits;
}

function afficherErreurCode(msg){
  var el = $('code-err');
  el.textContent = msg;
  el.style.display = 'block';
}

function ouvrirTournee(){
  var code = ($('code-input').value || '').trim();
  if(!code){ afficherErreurCode('Indique le code reçu par WhatsApp.'); return; }
  $('code-err').style.display = 'none';
  _connexionAnonyme.then(function(){
    return db.ref('dct_codes_externe/' + code).once('value');
  }).then(function(snap){
    var v = snap.val();
    if(!v || !v.collecteId || !v.camion){ afficherErreurCode('Code invalide. Vérifie le code reçu.'); return; }
    ctx = { collecteId: v.collecteId, camion: v.camion, nom: v.nom || '', code: code };
    chargerTruck();
  }).catch(function(e){
    console.error('chauffeur: lecture code', e);
    afficherErreurCode('Connexion impossible. Réessaie.');
  });
}

function chargerTruck(){
  // Écoute en direct : si DCT modifie les clients affectés pendant la
  // tournée, la liste se met à jour toute seule.
  db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion).on('value', function(snap){
    var tk = snap.val();
    if(!tk){ afficherErreurCode('Cette tournée n\'existe plus.'); $('ecran-code').hidden = false; $('ecran-tournee').hidden = true; return; }
    afficherTournee(tk);
  });
}

function afficherTournee(tk){
  truckCourant = tk;
  $('ecran-code').hidden = true;
  $('ecran-tournee').hidden = false;
  $('tr-nom').textContent = '👋 Salut ' + (tk.name || ctx.nom || '');
  var vEl = $('tr-version'); if(vEl) vEl.textContent = CHAUFFEUR_VERSION;
  var ids = tk.clients || [];
  var statuts = tk.chauffeurStatuts || {};
  var horaires = tk.hours || {};
  var faits = ids.filter(function(id){ return statuts[id]; }).length;
  $('tr-compteur').textContent = faits + ' / ' + ids.length + ' colis traités';
  $('tr-barre').style.width = (ids.length ? Math.round(faits / ids.length * 100) : 0) + '%';

  if(!ids.length){
    $('tr-liste').innerHTML = '<div style="text-align:center;color:#999;font-size:13px;padding:20px 0;">Aucun client affecté pour l\'instant.</div>';
    return;
  }

  // Ordre de ramassage : même tri que côté DCT (Dispatch) quand Issyaka a
  // donné un horaire à certains clients — sans horaire, ils restent à la
  // fin, dans l'ordre d'affectation (retour de Cobey du 01/09/2026).
  ids = ids.slice().sort(function(a, b){
    return (horaires[a] || '99').localeCompare(horaires[b] || '99');
  });

  // Charge les fiches clients une seule fois (nom/adresse/tél ne changent
  // pas pendant la tournée), puis ré-affiche à chaque mise à jour du
  // camion (statuts) sans re-télécharger les fiches.
  var idsManquants = ids.filter(function(id){ return !clientsTournee.some(function(c){ return c.id === id; }); });
  if(idsManquants.length){
    Promise.all(idsManquants.map(function(id){
      return db.ref('dct/clients/' + ctx.collecteId + '/' + id).once('value').then(function(s){
        var c = s.val(); if(!c) return null;
        c.id = id;
        return c;
      });
    })).then(function(res){
      res.forEach(function(c){ if(c) clientsTournee.push(c); });
      dessinerListe(ids, statuts, horaires);
    });
  } else {
    dessinerListe(ids, statuts, horaires);
  }
}

function dessinerListe(ids, statuts, horaires){
  var montants = (truckCourant && truckCourant.montantRecolte) || {};
  var h = '';
  ids.forEach(function(id){
    var c = clientsTournee.find(function(x){ return x.id === id; });
    if(!c) return;
    var st = statuts[id];
    var heure = horaires[id];
    var adresse = [c.adresse, c.cp, c.ville].filter(Boolean).join(', ');
    var tel = (c.tel || '').replace(/\s/g, '');
    var cls = st ? (st.etat === 'recupere' ? 'client fait' : 'client refuse') : 'client';
    h += '<div class="' + cls + '">'
      +   '<div class="client-top">'
      +     '<div><div class="client-nom">' + (heure ? ('🕐 ' + esc(heure) + ' — ') : '') + esc(c.name || '') + '</div>'
      +     '<div class="client-adresse">📍 ' + esc(adresse || '—') + '</div>'
      +     (c.colis ? ('<div class="client-colis">📦 ' + esc(c.colis) + '</div>') : '')
      +   '</div>';
    if(st) h += st.etat === 'recupere' ? '<span class="badge-fait">✓ Récupéré</span>' : '<span class="badge-refus">✕ Non récupéré</span>';
    h += '</div>';
    // Appeler / Waze restent accessibles même une fois le client clôturé
    // — le chauffeur peut avoir besoin de recontacter quelqu'un après
    // coup (retour de Cobey du 01/09/2026 : "s'il a besoin pour x raison
    // de revenir au client").
    h += '<div class="actions">'
      +    (tel ? ('<a class="act" href="tel:' + esc(tel) + '">📞 Appeler</a>') : '<span class="act" style="opacity:.4;">📞 —</span>')
      +    (adresse ? ('<button type="button" class="act" style="cursor:pointer;" onclick="ouvrirWaze(\'' + id + '\',\'' + esc(adresse).replace(/'/g, '&#39;') + '\')">🧭 Waze</button>') : '<span class="act" style="opacity:.4;">🧭 —</span>')
      +  '</div>';
    // v1.21.0 : bouton "j'arrive bientôt" — annonce l'arrivée imminente au
    // client, séparé du rappel avant-ramasse déjà envoyé côté DCT (retour
    // de Cobey du 06/09/2026). Numéro direct (wa.me), le chauffeur
    // complète juste le temps estimé après ouverture de WhatsApp.
    if(!st && tel){
      var msgArrive = 'Bonjour, c\'est votre chauffeur Dakar City Transport 🚚. Je suis en route pour venir récupérer votre colis, j\'arrive dans ';
      h += '<div class="actions">'
        +    '<button type="button" class="act act-whatsapp" onclick="event.stopPropagation();envoyerJArrive(\'' + esc(tel) + '\')">🚚 J\'arrive bientôt</button>'
        +  '</div>';
    }
    if(!st){
      h += '<div class="actions">'
        +    '<button type="button" class="act act-recup" style="flex:2;" onclick="ouvrirEcranPhoto(\'' + id + '\')">📷 Récupéré (photo)</button>'
        +    '<button type="button" class="act act-refus" style="flex:1;" onclick="ouvrirEcranMotif(\'' + id + '\')">✕</button>'
        +  '</div>';
    } else if(st.etat === 'recupere'){
      h += '<div class="cloture-note">Clôturé · ' + (st.nbPhotos || 0) + ' photo' + (st.nbPhotos > 1 ? 's' : '') + ' jointe' + (st.nbPhotos > 1 ? 's' : '') + ' · <span style="cursor:pointer;text-decoration:underline;" onclick="revenirSurClient(\'' + id + '\')">↩️ Revenir sur ce client</span></div>';
      var mr = montants[id];
      if(mr && mr.montant){
        var dansDelai = (Date.now() - (mr.ts || 0)) < MONTANT_DELAI_EDITION;
        h += '<div class="montant-note">💵 ' + (parseFloat(mr.montant)||0) + ' € reçus'
          + (dansDelai ? (' · <span style="cursor:pointer;text-decoration:underline;" onclick="ouvrirEditMontant(\'' + id + '\')">✏️ Modifier</span>') : ' · <span style="color:#999;">verrouillé</span>')
          + '</div>';
      }
    } else {
      h += '<div class="refus-note">' + esc(st.motifLib || '') + ' · <span style="cursor:pointer;text-decoration:underline;" onclick="revenirSurClient(\'' + id + '\')">↩️ Revenir sur ce client</span></div>';
    }
    h += '</div>';
  });
  $('tr-liste').innerHTML = h;
}

// v1.21.0 : bouton "🚚 J'arrive bientôt" — ouvre WhatsApp directement sur
// le numéro du client, message pré-rempli, le chauffeur ajoute juste le
// temps estimé avant d'envoyer.
function envoyerJArrive(tel){
  var numero = _telIntl(tel);
  if(!numero){ alert('Numéro de téléphone manquant.'); return; }
  var msg = 'Bonjour, c\'est votre chauffeur Dakar City Transport 🚚. Je suis en route pour venir récupérer votre colis, j\'arrive dans ';
  window.open('https://wa.me/' + numero + '?text=' + encodeURIComponent(msg), '_blank');
}

// Ouvre Waze pour ce client — écrit d'abord le départ (wazeTs) dans
// dispatch, exactement comme le fait DCT côté Dispatch natif (mêmes
// champ et chemin), pour que le camion externe apparaisse dans "Suivi
// live" (bug remonté par Cobey le 01/09/2026 : rien ne s'affichait dans
// Suivi malgré le clic Waze, car rien n'écrivait wazeTs). Premier clic
// fait foi, comme côté natif — on ne réécrit jamais un départ existant.
function ouvrirWaze(id, adresse){
  var url = 'https://waze.com/ul?q=' + encodeURIComponent(adresse) + '&navigate=yes';
  if(ctx && !(truckCourant && truckCourant.wazeTs && truckCourant.wazeTs[id])){
    var ts = Date.now();
    db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion + '/wazeTs/' + id).set(ts)
      .catch(function(e){ console.error('chauffeur: écriture départ waze', e); });
  }
  window.open(url, '_blank');
}

// Annule le statut d'un client déjà clôturé (récupéré ou non récupéré)
// pour permettre au chauffeur d'y revenir — les photos déjà envoyées, le
// cas échéant, restent en base et seront simplement remplacées s'il
// reprend une nouvelle série de photos.
function revenirSurClient(id){
  db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion + '/chauffeurStatuts/' + id).remove().then(function(){
    return db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion + '/finTs/' + id).remove();
  }).catch(function(e){
    console.error('chauffeur: annulation statut', e);
    alert('Erreur de connexion, réessaie.');
  });
}

// ---- Récupéré : photo(s), montant indicatif, puis clôture ----
function ouvrirEcranPhoto(id){
  clientCourantPhoto = id;
  photosCourantes = [];
  var c = clientsTournee.find(function(x){ return x.id === id; });
  $('ph-nom').textContent = c ? c.name : '';
  var mInp = $('ph-montant'); if(mInp) mInp.value = '';
  $('ecran-tournee').hidden = true;
  $('ecran-photo').hidden = false;
  redessinerVignettes();
}

function fermerEcranPhoto(){
  clientCourantPhoto = null;
  photosCourantes = [];
  $('ecran-photo').hidden = true;
  $('ecran-tournee').hidden = false;
}

function redessinerVignettes(){
  var h = '';
  photosCourantes.forEach(function(p){
    h += '<div class="photo-vignette"><img src="' + p.d + '"></div>';
  });
  $('ph-vignettes').innerHTML = h;
  $('ph-sous').textContent = photosCourantes.length
    ? (photosCourantes.length + ' photo' + (photosCourantes.length > 1 ? 's' : '') + ' prise' + (photosCourantes.length > 1 ? 's' : '') + '.')
    : 'Aucune photo prise — au moins une est obligatoire.';
  $('ph-btn-txt').textContent = photosCourantes.length ? 'Ajouter une autre photo' : 'Prendre une photo';
  var plein = photosCourantes.length >= PHOTO_MAX;
  $('ph-input').disabled = plein;
  var terminer = $('ph-terminer');
  terminer.disabled = photosCourantes.length === 0;
  terminer.style.opacity = photosCourantes.length === 0 ? '.45' : '1';
}

function photoChoisie(input){
  var f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  if(photosCourantes.length >= PHOTO_MAX) return;
  compresserPhoto(f, function(data){
    if(!data) return;
    photosCourantes.push({ d: data, ts: Date.now(), q: (ctx.nom || ''), uid: '' });
    redessinerVignettes();
  });
}

// v1.21.0 : "Passer" — juste un raccourci visuel pour vider le champ
// montant et confirmer explicitement qu'on saisit rien exprès (le champ
// n'est de toute façon jamais obligatoire pour clôturer).
function passerMontant(){
  var mInp = $('ph-montant');
  if(mInp) mInp.value = '';
  mInp.blur();
}

// v1.21.0 : le montant reçu, s'il est renseigné, passe par une
// confirmation avant d'être enregistré (retour de Cobey du 06/09/2026 :
// "avec modal de confirmation bien sûr") — sans montant renseigné, la
// clôture se fait directement, comme avant.
function terminerRecuperation(){
  if(!photosCourantes.length || !clientCourantPhoto) return;
  var mInp = $('ph-montant');
  var montant = mInp ? parseFloat(mInp.value) : NaN;
  if(!isNaN(montant) && montant > 0){
    var c = clientsTournee.find(function(x){ return x.id === clientCourantPhoto; });
    $('modal-montant-texte').textContent = 'Confirmer ' + montant + ' € reçus de ' + (c ? c.name : 'ce client') + ' ? (indicatif, ne remplace pas la facture)';
    $('modal-montant-confirm').classList.add('open');
    return;
  }
  _executerCloture(null);
}

function fermerModalMontant(){
  $('modal-montant-confirm').classList.remove('open');
}

function confirmerMontantEtCloture(){
  var mInp = $('ph-montant');
  var montant = mInp ? parseFloat(mInp.value) : NaN;
  $('modal-montant-confirm').classList.remove('open');
  _executerCloture(isNaN(montant) ? null : montant);
}

function _executerCloture(montant){
  var id = clientCourantPhoto;
  var ts = Date.now();
  var mapPhotos = {};
  photosCourantes.forEach(function(p, i){ mapPhotos['p' + i] = p; });
  var c = clientsTournee.find(function(x){ return x.id === id; });
  db.ref('dct_photos_colis/' + id).set(mapPhotos).then(function(){
    return db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion + '/chauffeurStatuts/' + id).set({
      etat: 'recupere', ts: ts, nbPhotos: photosCourantes.length
    });
  }).then(function(){
    // finTs = heure de fin, comme côté DCT natif (confirmValider) — sert
    // au calcul de durée et à l'heure affichés dans Suivi live.
    return db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion + '/finTs/' + id).set(ts);
  }).then(function(){
    // v1.21.0 : montant reçu, purement indicatif (ne touche jamais aux
    // versements/à la facture) — stocké à part, pour comparaison en fin
    // de journée entre DCT et le chauffeur (voir §37g).
    if(montant !== null){
      return db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion + '/montantRecolte/' + id).set({
        montant: montant, ts: ts, saisiPar: (ctx.nom || '')
      });
    }
  }).then(function(){
    _activiteExterne('🚚', 'Le chauffeur <strong>' + esc(ctx.nom || '') + '</strong> a récupéré le colis de <strong>' + esc(c ? c.name : '') + '</strong>');
    fermerEcranPhoto();
  }).catch(function(e){
    console.error('chauffeur: enregistrement récupération', e);
    alert('Erreur de connexion, réessaie.');
  });
}

// v1.21.0 : correction du montant dans les 10 minutes suivant la saisie
// initiale (voir MONTANT_DELAI_EDITION) — au-delà, verrouillé.
function ouvrirEditMontant(id){
  clientEnEditionMontant = id;
  var montants = (truckCourant && truckCourant.montantRecolte) || {};
  var mr = montants[id];
  $('edit-montant-input').value = mr ? mr.montant : '';
  $('modal-montant-edit').classList.add('open');
}

function fermerModalEditMontant(){
  clientEnEditionMontant = null;
  $('modal-montant-edit').classList.remove('open');
}

function confirmerEditMontant(){
  var id = clientEnEditionMontant;
  if(!id) return;
  var montants = (truckCourant && truckCourant.montantRecolte) || {};
  var mr = montants[id];
  if(!mr || (Date.now() - (mr.ts || 0)) >= MONTANT_DELAI_EDITION){
    alert('Délai de modification dépassé.');
    fermerModalEditMontant();
    return;
  }
  var val = parseFloat($('edit-montant-input').value);
  if(isNaN(val) || val < 0){ alert('Montant invalide.'); return; }
  // Le ts d'origine est conservé (base de la fenêtre de 10 min) — seule
  // la valeur change.
  db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion + '/montantRecolte/' + id + '/montant').set(val)
    .then(function(){ fermerModalEditMontant(); })
    .catch(function(e){ console.error('chauffeur: modification montant', e); alert('Erreur de connexion, réessaie.'); });
}

// ---- Non récupéré : motif ----
function ouvrirEcranMotif(id){
  clientCourantPhoto = id;
  var c = clientsTournee.find(function(x){ return x.id === id; });
  $('mo-nom').textContent = (c ? c.name : '') + ' — pourquoi ?';
  var h = '';
  MOTIFS_NON_RAMASSE.forEach(function(m){
    h += '<button type="button" class="motif" onclick="choisirMotif(\'' + m.id + '\',\'' + esc(m.lib).replace(/'/g, '&#39;') + '\')">' + esc(m.lib) + '</button>';
  });
  $('mo-liste').innerHTML = h;
  $('ecran-tournee').hidden = true;
  $('ecran-motif').hidden = false;
}

function fermerEcranMotif(){
  clientCourantPhoto = null;
  $('ecran-motif').hidden = true;
  $('ecran-tournee').hidden = false;
}

function choisirMotif(motifId, motifLib){
  var id = clientCourantPhoto;
  if(!id) return;
  var ts = Date.now();
  var c = clientsTournee.find(function(x){ return x.id === id; });
  db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion + '/chauffeurStatuts/' + id).set({
    etat: 'refuse', motif: motifId, motifLib: motifLib, ts: ts
  }).then(function(){
    // finTs = heure de fin, comme côté DCT natif (confirmRefus).
    return db.ref('dct/dispatch/' + ctx.collecteId + '/trucks/' + ctx.camion + '/finTs/' + id).set(ts);
  }).then(function(){
    _activiteExterne('❌', 'Le chauffeur <strong>' + esc(ctx.nom || '') + '</strong> — colis non récupéré chez <strong>' + esc(c ? c.name : '') + '</strong> (' + esc(motifLib) + ')');
    fermerEcranMotif();
  }).catch(function(e){
    console.error('chauffeur: enregistrement refus', e);
    alert('Erreur de connexion, réessaie.');
  });
}

// ---- Carte du trajet — consultation uniquement, réutilise les
// positions (lat/lng) déjà calculées côté DCT (carré "🗺️ Carte des
// clients" du Dispatch) quand la fiche du client a déjà été localisée.
// Pas de nouvelle géolocalisation ici — juste l'affichage de ce qui
// existe déjà (retour de Cobey du 01/09/2026).
function clientsAvecCoord(){
  if(!truckCourant) return [];
  var horaires = truckCourant.hours || {};
  var ids = (truckCourant.clients || []).slice().sort(function(a, b){
    return (horaires[a] || '99').localeCompare(horaires[b] || '99');
  });
  var out = [];
  ids.forEach(function(id){
    var c = clientsTournee.find(function(x){ return x.id === id; });
    if(c && c.lat && c.lng) out.push({ id: id, name: c.name || '', heure: horaires[id], lat: c.lat, lng: c.lng });
  });
  return out;
}

function chargerLeaflet(cb){
  if(typeof L !== 'undefined'){ cb(); return; }
  if(!document.getElementById('leaflet-css')){
    var link = document.createElement('link');
    link.id = 'leaflet-css';
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css';
    document.head.appendChild(link);
  }
  if(!document.getElementById('leaflet-js')){
    var s = document.createElement('script');
    s.id = 'leaflet-js';
    s.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js';
    s.onload = cb;
    s.onerror = function(){ alert('Impossible de charger la carte — vérifie ta connexion.'); };
    document.head.appendChild(s);
  } else {
    var wait = setInterval(function(){ if(typeof L !== 'undefined'){ clearInterval(wait); cb(); } }, 100);
  }
}

function ouvrirCarte(){
  var pts = clientsAvecCoord();
  if(!pts.length){ alert('Aucune position connue pour ces clients pour l\'instant.'); return; }
  $('ecran-tournee').hidden = true;
  $('ecran-carte').hidden = false;
  chargerLeaflet(function(){
    // Laisse le conteneur devenir visible avant d'initialiser Leaflet,
    // sinon la carte se dessine avec une taille de 0.
    setTimeout(function(){ dessinerCarte(pts); }, 50);
  });
}

function fermerCarte(){
  $('ecran-carte').hidden = true;
  $('ecran-tournee').hidden = false;
}

function dessinerCarte(pts){
  if(carteInstance){ carteInstance.remove(); carteInstance = null; }
  carteInstance = L.map('carte-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(carteInstance);
  var latlngs = [];
  pts.forEach(function(p, i){
    var icon = L.divIcon({
      className: '',
      html: '<div style="background:#006b2d;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);">' + (i + 1) + '</div>',
      iconSize: [26, 26], iconAnchor: [13, 13]
    });
    L.marker([p.lat, p.lng], { icon: icon }).addTo(carteInstance)
      .bindPopup((p.heure ? ('🕐 ' + esc(p.heure) + ' — ') : '') + esc(p.name));
    latlngs.push([p.lat, p.lng]);
  });
  if(latlngs.length > 1){
    L.polyline(latlngs, { color: '#006b2d', weight: 3, opacity: .8 }).addTo(carteInstance);
    carteInstance.fitBounds(latlngs, { padding: [30, 30] });
  } else {
    carteInstance.setView(latlngs[0], 14);
  }
}
</script>
